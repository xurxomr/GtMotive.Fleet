services:
  fleet-db:
    image: postgres:17.2-alpine
    container_name: gtmotive-fleet-db
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "5432:5432"
    volumes:
      - fleet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fleet-api:
    image: gtmotive-fleet-api
    container_name: gtmotive-fleet-api
    build:
      context: .
      dockerfile: src/GtMotive.Fleet.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__FleetDb: "Host=fleet-db;Port=5432;Database=fleet;Username=fleet;Password=fleet"
    ports:
      - "8080:8080"
    depends_on:
      fleet-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fleet-db-data:
